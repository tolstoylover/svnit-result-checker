name: Scrape SVNIT Results

on:
  # Every 3 hours, UTC
  schedule:
    - cron: "0 */3 * * *"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

  # Re-run on push (useful when tweaking the script)
  push:
    paths:
      - "scraper/**"
      - ".github/workflows/scrape.yml"

# Only one run at a time — prevents race conditions on results.json
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to commit results.json back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scraper/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit results.json if changed
        # Only commit if the file was actually modified
        run: |
          if [[ -n $(git status --porcelain results.json) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results.json
            git commit -m "chore: update results.json [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi