# scraper/scrape.py
import requests
from bs4 import BeautifulSoup
import json
import re
from datetime import datetime, timezone

URL = "https://www.svnit.ac.in/web/student_notice.php"
OUTPUT_FILE = "results.json"

def scrape_notices():
    resp = requests.get(URL, timeout=15, headers={
        "User-Agent": "Mozilla/5.0 (compatible; SVNITResultBot/1.0)"
    })
    resp.raise_for_status()
    soup = BeautifulSoup(resp.text, "html.parser")

    items = []
    for li in soup.select("ul.bullet li"):
        a = li.find("a")
        if not a or not a.get("href"):
            continue
        title = a.get_text(strip=True)
        href = a["href"]
        if not href.startswith("http"):
            href = "https://www.svnit.ac.in" + href

        # Flag anything that looks like a result notice
        is_result = bool(re.search(r"result", title, re.IGNORECASE)) or "/results/" in href.lower()

        items.append({
            "title": title,
            "url": href,
            "is_result": is_result
        })

    return items

def load_existing():
    try:
        with open(OUTPUT_FILE, "r", encoding="utf-8") as f:
            return json.load(f)
    except FileNotFoundError:
        return {"last_updated": None, "items": []}

def main():
    existing = load_existing()
    existing_urls = {item["url"] for item in existing.get("items", [])}

    scraped = scrape_notices()

    # Mark genuinely new items
    for item in scraped:
        item["is_new"] = item["url"] not in existing_urls

    output = {
        "last_updated": datetime.now(timezone.utc).isoformat(),
        "items": scraped
    }

    with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
        json.dump(output, f, indent=2, ensure_ascii=False)

    print(f"Scraped {len(scraped)} notices, "
          f"{sum(i['is_new'] for i in scraped)} new.")

if __name__ == "__main__":
    main()
