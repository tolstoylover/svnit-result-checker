<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SVNIT Result Checker</title>
<style>
  /* ── Full CSS from previous version, unchanged ── */
  :root {
    --bg: #f4f7fb; --surface: #fff; --surface-2: #f8fafc;
    --text: #1a2b42; --text-muted: #5a6a80; --border: #e2e8f0;
    --primary: #0055a5; --primary-dark: #003366;
    --accent: #2ecc71; --accent-dark: #27ae60;
    --new-badge: #e74c3c; --warning: #f39c12;
    --shadow: 0 4px 16px rgba(0,51,102,.08);
    --radius: 10px; --radius-sm: 6px;
  }
  [data-theme="dark"] {
    --bg: #0f1724; --surface: #1a2332; --surface-2: #243044;
    --text: #e6edf6; --text-muted: #93a3b8; --border: #2d3b52;
    --primary: #4a9eff; --primary-dark: #2d7ed9;
    --new-badge: #ff5a5f;
    --shadow: 0 4px 16px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding:24px 16px;transition:background .25s,color .25s}
  .widget{max-width:760px;margin:0 auto;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .widget-header{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .widget-header h1{margin:0;font-size:1.25rem;font-weight:600}
  .widget-header p{margin:4px 0 0;font-size:.82rem;opacity:.85}
  .theme-toggle{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;flex-shrink:0}
  .theme-toggle:hover{background:rgba(255,255,255,.25)}
  .info-banner{padding:12px 24px;background:rgba(0,85,165,.08);border-bottom:1px solid var(--border);font-size:.82rem;color:var(--text-muted);display:flex;gap:8px;align-items:flex-start}
  [data-theme="dark"] .info-banner{background:rgba(74,158,255,.08)}
  .info-banner a{color:var(--primary)}
  .toolbar{padding:16px 24px;display:flex;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--border)}
  .search-box{flex:1 1 220px;position:relative;min-width:0}
  .search-box input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);font-size:.92rem;outline:none}
  .search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,85,165,.15)}
  .search-box::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55}
  select.filter-select{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);font-size:.9rem;cursor:pointer;outline:none}
  .btn{padding:10px 14px;border:none;border-radius:var(--radius-sm);font-size:.9rem;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
  .btn-ghost:hover{background:var(--surface-2);color:var(--text)}
  .stats{padding:10px 24px;font-size:.82rem;color:var(--text-muted);background:var(--surface-2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .stats strong{color:var(--text)}
  .stat-new{color:var(--new-badge);font-weight:600}
  .group{border-bottom:1px solid var(--border)}
  .group:last-child{border-bottom:none}
  .group-header{padding:12px 24px;background:var(--surface-2);cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
  .group-header:hover{background:var(--surface)}
  .group-title{font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:10px}
  .group-meta{font-size:.8rem;color:var(--text-muted);display:flex;gap:12px;align-items:center}
  .chevron{transition:transform .2s;font-size:.75rem}
  .group.collapsed .chevron{transform:rotate(-90deg)}
  .group.collapsed .group-body{display:none}
  .results-list{padding:0;margin:0;list-style:none}
  .result-row{padding:14px 24px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
  .result-row:hover{background:var(--surface-2)}
  .result-row.unseen{background:rgba(46,204,113,.04)}
  [data-theme="dark"] .result-row.unseen{background:rgba(46,204,113,.08)}
  .result-info{flex:1 1 320px;min-width:0}
  .result-title{font-weight:600;font-size:.98rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .result-date{font-size:.8rem;color:var(--text-muted);margin-top:2px}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
  .badge-new{background:var(--new-badge);color:#fff}
  .badge-even{background:#3498db;color:#fff}
  .badge-odd{background:var(--warning);color:#fff}
  .badge-suppl{background:#9b59b6;color:#fff}
  .badge-other{background:#95a5a6;color:#fff}
  .result-actions{display:flex;gap:6px;flex-wrap:wrap}
  .icon-btn{width:34px;height:34px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:.95rem}
  .icon-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--surface-2)}
  .icon-btn.copied{color:var(--accent);border-color:var(--accent)}
  .open-link{padding:8px 14px;background:var(--accent);color:#fff;text-decoration:none;border-radius:var(--radius-sm);font-size:.85rem;font-weight:500;display:inline-flex;align-items:center;gap:6px}
  .open-link:hover{background:var(--accent-dark)}
  .empty-state{padding:40px 24px;text-align:center;color:var(--text-muted)}
  .empty-state .emoji{font-size:2rem;margin-bottom:8px}
  .widget-footer{padding:14px 24px;background:var(--surface-2);border-top:1px solid var(--border);font-size:.78rem;color:var(--text-muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .widget-footer a{color:var(--primary);text-decoration:none}
  .widget-footer a:hover{text-decoration:underline}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--surface);padding:10px 18px;border-radius:var(--radius-sm);font-size:.88rem;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:100}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading{text-align:center;padding:40px 24px;color:var(--text-muted)}
  .spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:520px){.widget-header{padding:18px 16px}.widget-header h1{font-size:1.1rem}.toolbar,.group-header,.result-row,.widget-footer,.info-banner,.stats{padding-left:16px;padding-right:16px}.result-actions{width:100%;justify-content:flex-start}}
</style>
</head>
<body>

<div class="widget" id="widget">
  <header class="widget-header">
    <div>
      <h1>🎓 SVNIT Result Checker</h1>
      <p>Auto-updates every 3 hours from svnit.ac.in</p>
    </div>
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
  </header>

  <div class="info-banner">
    <span>🔄</span>
    <div>
      <strong>Last updated:</strong> <span id="lastUpdated">—</span>.
      Source: <a href="https://www.svnit.ac.in/web/student_notice.php" target="_blank" rel="noopener">svnit.ac.in</a>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by month, year, keyword…" />
    </div>
    <select class="filter-select" id="yearFilter" aria-label="Year">
      <option value="all">All years</option>
    </select>
    <select class="filter-select" id="sessionFilter" aria-label="Session">
      <option value="all">All sessions</option>
      <option value="Even">Even</option>
      <option value="Odd">Odd</option>
      <option value="Supplementary">Supplementary</option>
    </select>
    <button class="btn btn-ghost" id="markAllBtn">✓ Mark all seen</button>
  </div>

  <div class="stats" id="statsBar"><span>Loading…</span></div>
  <main id="resultsContainer"><div class="loading"><div class="spinner"></div></div></main>
  <footer class="widget-footer">
    <span>Auto-synced · <a href="https://www.svnit.ac.in/web/student_notice.php" target="_blank" rel="noopener">Official source</a></span>
    <span id="seenCounter"></span>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ⚙️ CONFIGURATION
   ============================================================
   Replace with YOUR raw GitHub URL after the first Action run:
   https://raw.githubusercontent.com/YOUR-USER/svnit-result-checker/main/results.json
   ============================================================ */
const DATA_URL = "";  // ← PASTE YOUR RAW URL HERE

/* Embedded fallback so the widget still works offline or before
   the first Action run. Will be replaced by live data on load. */
const FALLBACK_RESULTS = [
  { id: "april-may-2026", title: "Result of APRIL/MAY 2026 Examination",
    url: "https://www.svnit.ac.in/web/results/result_april-may-2026.php",
    date: "2026-06-20", session: "Even", year: 2026 },
  { id: "nov-dec-2025", title: "Result of NOV/DEC 2025 Examination",
    url: "https://www.svnit.ac.in/web/results/result_nov-dec-2025.php",
    date: "2026-01-10", session: "Odd", year: 2025 },
  { id: "supplementary-july-2026", title: "Supplementary Examination — July 2026",
    url: "https://www.svnit.ac.in/Data/Notice/2026/July/NEP_Supplementary and Backlog Examination Time Table_July 2026.pdf",
    date: "2026-07-05", session: "Supplementary", year: 2026 },
];

/* ============================================================
   STATE & PERSISTENCE
   ============================================================ */
const STORAGE_KEY = "svnit_seen_results_v2";
const THEME_KEY   = "svnit_theme";

const state = {
  results: [],
  searchQuery: "",
  filterYear: "all",
  filterSession: "all",
  collapsedGroups: new Set(),
  seenIds: new Set(),
};

function storageAvailable() {
  try { return typeof localStorage !== "undefined" && localStorage !== null; }
  catch { return false; }
}

function loadSeen() {
  if (!storageAvailable()) return;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) JSON.parse(raw).forEach(id => state.seenIds.add(id));
  } catch (e) { console.warn("Failed to read seen state:", e); }
}

function saveSeen() {
  if (!storageAvailable()) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...state.seenIds])); }
  catch (e) { console.warn("Failed to save seen state:", e); }
}

function loadTheme() {
  const saved = storageAvailable() ? localStorage.getItem(THEME_KEY) : null;
  applyTheme(saved === "dark" ? "dark" : "light");
}

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("themeToggle").textContent = theme === "dark" ? "☀️" : "🌙";
  if (storageAvailable()) localStorage.setItem(THEME_KEY, theme);
}

/* ============================================================
   DATA LOADING
   ============================================================ */
async function loadResults() {
  // Try live JSON first
  if (DATA_URL) {
    try {
      // Cache-bust so we always get the freshest version
      const url = DATA_URL + (DATA_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        state.results = data.sort((a, b) => new Date(b.date) - new Date(a.date));
        document.getElementById("lastUpdated").textContent =
          new Date().toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
        return;
      }
    } catch (e) {
      console.warn("Live fetch failed, using fallback:", e);
    }
  }
  // Fallback
  state.results = FALLBACK_RESULTS;
  document.getElementById("lastUpdated").textContent = "offline / fallback";
}

/* ============================================================
   RENDERING (unchanged logic from previous version)
   ============================================================ */
function formatDate(iso) {
  return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function sessionBadgeClass(s) {
  return s === "Even" ? "badge-even" : s === "Odd" ? "badge-odd"
       : s === "Supplementary" ? "badge-suppl" : "badge-other";
}

function groupKey(r) { return `${r.year}__${r.session}`; }

function getFilteredResults() {
  const q = state.searchQuery.trim().toLowerCase();
  return state.results
    .filter(r => state.filterYear === "all" || String(r.year) === state.filterYear)
    .filter(r => state.filterSession === "all" || r.session === state.filterSession)
    .filter(r => {
      if (!q) return true;
      return `${r.title} ${r.date} ${r.session} ${r.year}`.toLowerCase().includes(q);
    });
}

function render() {
  const filtered = getFilteredResults();
  const container = document.getElementById("resultsContainer");
  const total = state.results.length;
  const newCount = state.results.filter(r => !state.seenIds.has(r.id)).length;

  document.getElementById("statsBar").innerHTML = `
    <span>Showing <strong>${filtered.length}</strong> of <strong>${total}</strong>
    ${newCount > 0 ? ` · <span class="stat-new">${newCount} new</span>` : ""}</span>
    <span>${filtered.length === 0 && (state.searchQuery || state.filterYear !== "all")
      ? "No matches." : ""}</span>`;

  document.getElementById("seenCounter").textContent =
    `${state.seenIds.size} of ${total} seen`;

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="emoji">📭</div>
        <div><strong>No results found</strong></div>
        <div>Try clearing the search or filters.</div>
      </div>`;
    return;
  }

  const groups = new Map();
  filtered.forEach(r => {
    const key = groupKey(r);
    if (!groups.has(key)) groups.set(key, { ref: r, items: [] });
    groups.get(key).items.push(r);
  });

  const sessionOrder = { Even: 0, Odd: 1, Supplementary: 2, Other: 3 };
  const sorted = [...groups.values()].sort((a, b) =>
    a.ref.year !== b.ref.year ? b.ref.year - a.ref.year
    : sessionOrder[a.ref.session] - sessionOrder[b.ref.session]);

  container.innerHTML = sorted.map(g => {
    const collapsed = state.collapsedGroups.has(groupKey(g.ref)) ? "collapsed" : "";
    const newInGroup = g.items.filter(r => !state.seenIds.has(r.id)).length;
    return `
      <section class="group ${collapsed}" data-key="${groupKey(g.ref)}">
        <div class="group-header" role="button" tabindex="0"
             onclick="toggleGroup('${groupKey(g.ref)}')"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleGroup('${groupKey(g.ref)}')}">
          <div class="group-title">
            <span class="chevron">▼</span>
            <span>${g.ref.session} Semester · ${g.ref.year}</span>
          </div>
          <div class="group-meta">
            <span>${g.items.length} result${g.items.length !== 1 ? "s" : ""}</span>
            ${newInGroup > 0 ? `<span class="stat-new">· ${newInGroup} new</span>` : ""}
          </div>
        </div>
        <div class="group-body">
          <ul class="results-list">
            ${g.items.map(renderRow).join("")}
          </ul>
        </div>
      </section>`;
  }).join("");
}

function renderRow(r) {
  const isNew = !state.seenIds.has(r.id);
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  return `
    <li class="result-row ${isNew ? "unseen" : ""}">
      <div class="result-info">
        <div class="result-title">
          <span>${esc(r.title)}</span>
          ${isNew ? '<span class="badge badge-new">NEW</span>' : ""}
          <span class="badge ${sessionBadgeClass(r.session)}">${r.session}</span>
        </div>
        <div class="result-date">Published ${formatDate(r.date)} · ${r.year}</div>
      </div>
      <div class="result-actions">
        <button class="icon-btn" title="Copy link"
                onclick="copyLink('${r.id}', this)">🔗</button>
        <a class="open-link" href="${esc(r.url)}" target="_blank"
           rel="noopener" onclick="markSeen('${r.id}')">Open ↗</a>
      </div>
    </li>`;
}

/* ============================================================
   ACTIONS
   ============================================================ */
function toggleGroup(key) {
  state.collapsedGroups.has(key) ? state.collapsedGroups.delete(key)
                                 : state.collapsedGroups.add(key);
  render();
}

function markSeen(id) {
  if (!state.seenIds.has(id)) {
    state.seenIds.add(id);
    saveSeen();
    setTimeout(render, 400);
  }
}

function markAllSeen() {
  state.results.forEach(r => state.seenIds.add(r.id));
  saveSeen();
  render();
  showToast("All marked as seen");
}

function copyLink(id, btn) {
  const r = state.results.find(x => x.id === id);
  if (!r) return;
  const flash = () => {
    btn.classList.add("copied"); btn.textContent = "✓";
    showToast("Link copied!");
    setTimeout(() => { btn.classList.remove("copied"); btn.textContent = "🔗"; }, 1500);
  };
  if (navigator.clipboard) navigator.clipboard.writeText(r.url).then(flash);
  else {
    const ta = document.createElement("textarea");
    ta.value = r.url; document.body.appendChild(ta);
    ta.select(); try { document.execCommand("copy"); flash(); } catch {}
    document.body.removeChild(ta);
  }
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 2000);
}

function populateYearFilter() {
  const sel = document.getElementById("yearFilter");
  [...new Set(state.results.map(r => r.year))].sort((a, b) => b - a).forEach(y => {
    const o = document.createElement("option");
    o.value = y; o.textContent = y;
    sel.appendChild(o);
  });
}

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  loadTheme();
  loadSeen();

  document.getElementById("searchInput").addEventListener("input", e => {
    state.searchQuery = e.target.value; render();
  });
  document.getElementById("yearFilter").addEventListener("change", e => {
    state.filterYear = e.target.value; render();
  });
  document.getElementById("sessionFilter").addEventListener("change", e => {
    state.filterSession = e.target.value; render();
  });
  document.getElementById("markAllBtn").addEventListener("click", markAllSeen);
  document.getElementById("themeToggle").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme") || "light";
    applyTheme(cur === "dark" ? "light" : "dark");
  });

  await loadResults();
  populateYearFilter();
  render();
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
